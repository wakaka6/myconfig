# general
set -q -g status-utf8 on                  # expect UTF-8 (tmux < 2.2)
setw -q -g utf8 on

set -g history-limit 10000
set -g mouse on
setw -g xterm-keys on
set -sg repeat-time 300
set -s focus-events on
set -sg exit-empty on
set -g detach-on-destroy off              # 关闭最后 pane 时切到其他 session 而非 detach

set -g visual-activity off
setw -g monitor-activity off
setw -g monitor-bell off

# -- display
set -g base-index 1
setw -g pane-base-index 1

setw -g automatic-rename on
set -g renumber-windows on

set -g set-titles on

set -g display-panes-time 2000
set -g display-time 2000

set -g status-interval 1

# Pane 顶部状态条 — 右上角显示 pane tag
set -g pane-border-status top
set -g pane-border-format "#[align=right]#{pane_title}"

unbind r
bind r source-file ~/.tmux.conf
## Vim 风格的快捷键绑定
#复制模式用vim快捷键
setw -g mode-keys vi
# 命令提示符用vim快捷键
set-option -g status-keys vi
# 使用 Vim 风格的按键在窗格间移动
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane 移动（同构 AwesomeWM Super+Shift+hjkl）
bind H swap-pane -s '{left-of}'
bind J swap-pane -s '{down-of}'
bind K swap-pane -s '{up-of}'
bind L swap-pane -s '{right-of}'

# Pane 调整大小（同构 AwesomeWM Ctrl+Super+h/l）
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Pane 打 tag — 显示在窗格右上角
bind T command-prompt -p "(pane tag)" "select-pane -T '%%'"

# Pane 拆出/合并（同构 AwesomeWM Super+Shift+n/p 跨屏）
bind ! break-pane
bind @ choose-window "join-pane -t '%%'"

# 较易于使用的窗格分割快捷键
bind + split-window -h -c '#{pane_current_path}'
bind = split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# windows navigation
unbind 1
unbind 2
unbind 3
unbind 4
unbind 5
unbind 6
unbind 7
unbind 8
unbind 9
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

set -g default-terminal "tmux-256color"
set -sg escape-time 5 # fix vim esc delay
set -ga terminal-overrides ",*256col*:Tc" # fixes vim reproducing slightly wrong colors in tmux
set -as terminal-features ",xterm-256color:RGB"
set -g allow-passthrough on # let apps like Yazi query/render through tmux

# -- Catppuccin theme (auto-install + options BEFORE run)
if "test ! -d ~/.config/tmux/plugins/catppuccin/tmux" \
   "run 'git clone https://github.com/catppuccin/tmux.git ~/.config/tmux/plugins/catppuccin/tmux'"
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux


set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# -- Agent Tracker
#set -ag status-right '#{?#{==:#{@tracker_summary},},, #{@tracker_summary}#[default] }'
#bind-key A display-popup -E -w 80% -h 60% -b rounded -T " Agent Tracker " "~/.claude/scripts/tracker-popup.sh"
#bind-key -n M-m run-shell -b "~/.claude/scripts/tracker-focus.sh"
#set-hook -g pane-exited 'run-shell -b "~/.claude/scripts/tracker-summary.sh"'
#set-hook -g pane-died   'run-shell -b "~/.claude/scripts/tracker-summary.sh"'

# -- Plugins (TPM auto-install + at the very end)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '5'
run '~/.tmux/plugins/tpm/tpm'
