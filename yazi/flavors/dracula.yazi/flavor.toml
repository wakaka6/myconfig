# Dracula flavor for current Yazi theme schema.

[app]
overall = { bg = "#282a36" }

[mgr]
cwd = { fg = "#bd93f9", bold = true }
border_symbol = " "
border_style = { fg = "#44475a" }
tab_active = { fg = "#282a36", bg = "#bd93f9", bold = true }
tab_inactive = { fg = "#f8f8f2", bg = "#44475a" }
marker_copied = { fg = "#282a36", bg = "#50fa7b" }
marker_cut = { fg = "#282a36", bg = "#ff5555" }
marker_selected = { fg = "#282a36", bg = "#ffb86c" }

[status]
separator_open = ""
separator_close = ""
mode_normal = { fg = "#282a36", bg = "#bd93f9", bold = true }
mode_select = { fg = "#282a36", bg = "#50fa7b", bold = true }
mode_unset = { fg = "#282a36", bg = "#ff5555", bold = true }
progress_label = { fg = "#f8f8f2", bold = true }
progress_normal = { fg = "#bd93f9", bg = "#44475a" }
progress_error = { fg = "#ff5555", bg = "#44475a" }

[indicator]
current = { fg = "#f8f8f2", bg = "#44475a", italic = true }
preview = { fg = "#f8f8f2", bg = "#44475a" }

[input]
border = { fg = "#bd93f9" }
title = { fg = "#f8f8f2", bold = true }
value = { fg = "#f8f8f2" }
selected = { bg = "#44475a" }

[select]
border = { fg = "#bd93f9" }
active = { fg = "#50fa7b", bold = true }
inactive = { fg = "#f8f8f2" }

[tasks]
border = { fg = "#bd93f9" }
title = { fg = "#f8f8f2", bold = true }
hovered = { bg = "#44475a" }

[which]
mask = { bg = "#282a36" }
cand = { fg = "#8be9fd" }
rest = { fg = "#6272a4" }
desc = { fg = "#f8f8f2" }
separator = " -> "
separator_style = { fg = "#6272a4" }

[help]
on = { fg = "#8be9fd" }
run = { fg = "#50fa7b" }
desc = { fg = "#f8f8f2" }
hovered = { bg = "#44475a" }
footer = { fg = "#282a36", bg = "#bd93f9" }

[notify]
title_info = { fg = "#50fa7b" }
title_warn = { fg = "#f1fa8c" }
title_error = { fg = "#ff5555" }

[filetype]
rules = [
  { url = "*/", fg = "#bd93f9", bold = true },
  { url = ".git/", fg = "#ff5555", bold = true },
  { url = "node_modules/", fg = "#6272a4" },
  { url = "*.{md,mdx,rst}", fg = "#f1fa8c", italic = true },
  { url = "*.{json,yaml,yml,toml,xml,ini,conf,cfg}", fg = "#8be9fd" },
  { url = "*.{html,htm,css,scss,sass,less}", fg = "#ff79c6", italic = true },
  { url = "*.{js,ts,jsx,tsx,vue,svelte}", fg = "#f1fa8c", italic = true },
  { url = "*.{py,rb,php,java,go,rs,c,h,cpp,hpp}", fg = "#50fa7b", italic = true },
  { url = "*.{sh,bash,zsh,fish}", fg = "#50fa7b", italic = true },
  { url = "*.{jpg,jpeg,png,gif,webp,avif,svg}", fg = "#8be9fd" },
  { url = "*.{mp3,flac,m4a,wav,ogg}", fg = "#bd93f9" },
  { url = "*.{mp4,mkv,avi,mov}", fg = "#bd93f9" },
  { url = "*.{zip,gz,tar,7z,rar,xz,zst}", fg = "#ffb86c" },
  { url = "*.{pdf,epub,mobi}", fg = "#ff5555", bold = true },
  { url = "*", fg = "#f8f8f2" },
]
