#################################
#             Shadows           #
#################################

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -5;
shadow-offset-y = -5;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'Rofi'",
  "class_g = 'fcitx'",
  "class_g = 'Fcitx5'",
  "window_type = 'dnd'",
  "bounding_shaped && !rounded_corners",
  "_GTK_FRAME_EXTENTS@",
  "_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'"
];

#################################
#           Fading              #
#################################

fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 5;
no-fading-destroyed-argb = true;

#################################
#   Transparency / Opacity      #
#################################

inactive-opacity = 0.82;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;
inactive-dim = 0.10;

focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'fcitx'",
  "class_g = 'Fcitx5'",
  "class_g = 'Rofi'",
  "class_g = 'GoldenDict'",
  "class_g = 'goldendict'",
  "class_g = 'awesome'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'"
];

#################################
#           Corners             #
#################################

corner-radius = 12;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "class_g = 'Rofi'",
  "class_g = 'Google-chrome'",
  "class_g = 'Chromium'",
  "_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'"
];

#################################
#     Background-Blurring       #
#################################

blur-method = "dual_kawase";
blur-strength = 3;

blur-background-exclude = [
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Rofi'",
  "class_g = 'slop'",
  "class_g = 'Google-chrome'",
  "class_g = 'Chromium'",
  "bounding_shaped && !rounded_corners",
  "_GTK_FRAME_EXTENTS@"
];

#################################
#       General Settings        #
#################################

backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
glx-no-stencil = true;
use-damage = true;
log-level = "warn";

#################################
#          Wintypes             #
#################################

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.9; focus = true; blur-background = false; };
  dock = { shadow = false; clip-shadow-above = true; blur-background = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; shadow = true; blur-background = false; };
  dropdown_menu = { opacity = 1.0; shadow = true; blur-background = false; };
  menu = { opacity = 1.0; shadow = false; blur-background = false; };
  notification = { shadow = true; opacity = 0.95; };
};
