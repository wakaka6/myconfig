###
### Windows
###
# Match ghostty's confirm-close-surface = false.
confirm_os_window_close 0
# Resize in cell steps so the grid never rewraps mid-drag (smoother on macOS).
resize_in_steps yes

###
###  fonts
###
# Nerd Font variant of Fira Code: same glyphs as ghostty's "Fira Code",
# plus icons for starship/lsd.
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.8
disable_ligatures cursor

###
### Cursor
###
# Trail effect: leaves a short fading tail when the cursor jumps.
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

###
### Scrollback
###
# Match alacritty's scrolling.history = 20000.
scrollback_lines 20000
# "Vi mode": open scrollback in neovim (Ctrl+Q below). Requires nvim 0.12+.
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

###
### Mouse
###
mouse_hide_wait 1
open_url_with default
# Match alacritty's selection.save_to_clipboard.
copy_on_select yes

###
### Layouts & tabs
###
# splits: arbitrary split tree (tmux-style panes); stack: maximized windows.
enabled_layouts splits,stack

# Powerline tab bar like the screenshot: slanted separators, purple active tab.
# Powerline tab bar like the screenshot: slanted separators, purple active tab.
# Powerline tab bar like the screenshot: slanted separators, purple active tab.
tab_bar_style powerline
tab_powerline_style slanted
# Tabs on top, macOS title bar hidden.
tab_bar_edge top
hide_window_decorations titlebar-only

###
### themes
###
include dracula.conf
background_opacity 0.9
dynamic_background_opacity yes

# Tab colors must come after the theme include or dracula overrides them.
active_tab_background #bd93f9
active_tab_foreground #282a36

###
### maps
###
kitty_mod ctrl+shift

# Send Option as Alt so alt+key bindings below reach applications.
macos_option_as_alt yes

map ctrl+space no_op

# scrolling (alacritty parity)
map alt+k scroll_line_up
map alt+j scroll_line_down
map ctrl+alt+k scroll_page_up
map ctrl+alt+j scroll_page_down

# vi mode (alacritty ToggleViMode): opens scrollback in nvim
map ctrl+shift+space show_scrollback
# Unmap kitty's default ctrl+shift+h show_scrollback.
map ctrl+shift+h no_op
# Fullscreen (replaces kitty's default cmd+f search_scrollback).
map cmd+f toggle_fullscreen

# font size (alacritty parity: bare ctrl, plus ctrl+shift+arrows)
# font size (alacritty parity: bare ctrl, plus ctrl+shift+arrows)
# font size (alacritty parity: bare ctrl, plus ctrl+shift+arrows)
# Bare `map <key>` unmaps kitty's default scroll bindings on the same chords.
map ctrl+shift+up
map ctrl+shift+down
map ctrl+equal       change_font_size all +1.0
map ctrl+plus        change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+shift+up    change_font_size all +1.0
map ctrl+shift+down  change_font_size all -1.0
# ctrl+shift+home already resets font size in kitty's defaults.

# Windows
# Windows & splits (tmux/iTerm2 parity)
# cmd+enter: new window, auto-split (splits layout default axis = side by side)
map cmd+enter new_window
# cmd+d: split side by side (kitty vsplit); cmd+shift+d: stacked (hsplit)
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
# cmd+shift+enter: new OS window (was already bound)
map cmd+shift+enter new_os_window_with_cwd
map ctrl+shift+n
map ctrl+shift+n launch --cwd=current

# Tabs: cmd+t new, cmd+w close, cmd+shift+[/] cycle, alt+1..9 jump (tmux habit)
# Tabs: cmd+t new, cmd+w close, cmd+shift+[/] cycle.
# No alt+N tab jumps: herdr owns alt+1..9 and kitty would swallow them.
map cmd+t new_tab
map cmd+w close_tab
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab

# Pane navigation inside a tab
map cmd+] next_window
map cmd+[ previous_window
map cmd+o neighboring_window

# hints (alacritty parity). Wrapped by hints-if-match.sh which pre-checks the
# screen via `kitty @ get-text` so no-match never shows kitty's blocking
# "No matches found" error overlay.
map alt+u remote_control_script hints-if-match.sh '(file|ftp|ftps|gemini|git|gopher|https?|ircs?|kitty|mailto|news|sftp|ssh)://[^[:space:]]{3,}'
map alt+y remote_control_script hints-if-match.sh '(file|ftp|ftps|gemini|git|gopher|https?|ircs?|kitty|mailto|news|sftp|ssh)://[^[:space:]]{3,}' --type=url --program @
map alt+i remote_control_script hints-if-match.sh '(25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9]\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])' --type=regex --regex='(?:25[0-5]|2[0-4]\d|[01]?\d?\d\.){3}(?:25[0-5]|2[0-4]\d|[01]?\d?\d)' --program @

mouse_map alt+left press ungrabbed mouse_selection rectangle
mouse_map alt+left doublepress ungrabbed mouse_selection word
mouse_map alt+left triplepress ungrabbed mouse_selection line
