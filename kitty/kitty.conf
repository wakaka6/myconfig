###
### Windows
###
# Match ghostty's confirm-close-surface = false.
confirm_os_window_close 0
# Resize in cell steps so the grid never rewraps mid-drag (smoother on macOS).
resize_in_steps yes

###
###  fonts
###
# Nerd Font variant of Fira Code: same glyphs as ghostty's "Fira Code",
# plus icons for starship/lsd.
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.8
disable_ligatures cursor

###
### Cursor
###
# Trail effect: leaves a short fading tail when the cursor jumps.
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

###
### Scrollback
###
# Match alacritty's scrolling.history = 20000.
scrollback_lines 20000
# "Vi mode": open scrollback in neovim (Ctrl+Q below). Requires nvim 0.12+.
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

###
### Mouse
###
mouse_hide_wait 1
open_url_with default
# Match alacritty's selection.save_to_clipboard.
copy_on_select yes

###
### themes
###
include dracula.conf
background_opacity 0.9
dynamic_background_opacity yes

###
### maps
###
kitty_mod ctrl+shift

# Send Option as Alt so alt+key bindings below reach applications.
macos_option_as_alt yes

map ctrl+space no_op

# scrolling (alacritty parity)
map alt+k scroll_line_up
map alt+j scroll_line_down
map ctrl+alt+k scroll_page_up
map ctrl+alt+j scroll_page_down

# vi mode (alacritty ToggleViMode): opens scrollback in nvim
map ctrl+q show_scrollback

# font size (alacritty parity: bare ctrl, plus ctrl+shift+arrows)
# font size (alacritty parity: bare ctrl, plus ctrl+shift+arrows)
# font size (alacritty parity: bare ctrl, plus ctrl+shift+arrows)
# Bare `map <key>` unmaps kitty's default scroll bindings on the same chords.
map ctrl+shift+up
map ctrl+shift+down
map ctrl+equal       change_font_size all +1.0
map ctrl+plus        change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+shift+up    change_font_size all +1.0
map ctrl+shift+down  change_font_size all -1.0
# ctrl+shift+home already resets font size in kitty's defaults.

# Windows
map cmd+shift+enter new_os_window_with_cwd
map ctrl+shift+n
map ctrl+shift+n launch --cwd=current

# hints (alacritty parity)
map alt+u open_url_with_hints
map alt+y kitten hints --type=url --program @
map alt+i kitten hints --type=regex --regex='(?:25[0-5]|2[0-4]\d|[01]?\d?\d\.){3}(?:25[0-5]|2[0-4]\d|[01]?\d?\d)' --program @

mouse_map alt+left press ungrabbed mouse_selection rectangle
mouse_map alt+left doublepress ungrabbed mouse_selection word
mouse_map alt+left triplepress ungrabbed mouse_selection line
