# Click actions for OSC8 hyperlinks (Ctrl+Shift+click).
# Entries are matched top-down; first match wins. Blank line separates entries.

# rg --hyperlink-format=kitty emits file:// URLs with #<line> fragments.
# Open them in nvim at the matching line, in an overlay window.
# --copy-env inherits PATH etc. from the current window's shell so that
# tools like node (Copilot.lua) are found.
protocol file
fragment_matches [0-9]+
action launch --type=overlay --cwd=current --copy-env nvim +${FRAGMENT} -- ${FILE_PATH}

# Plain text file links (no fragment) open in the editor at the top.
protocol file
mime text/*
action launch --type=overlay --cwd=current --copy-env -- nvim -- ${FILE_PATH}
